name: Docker Image Prod CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build image
        run: docker build -t enflux/grafana:latest -t enflux/grafana:13.0.1 -f Dockerfile .

      - name: Push images
        run: |
          docker push enflux/grafana:13.0.1
          docker push enflux/grafana:latest
